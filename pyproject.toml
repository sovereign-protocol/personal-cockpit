[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-cockpit"
version = "0.1.0a1"
description = "Personal Cockpit cross-application view for Sovereign Core"
requires-python = ">=3.10"
dependencies = [
  "sovereign-protocol>=0.1.0,<0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["personal_cockpit*"]

[tool.setuptools.package-data]
"personal_cockpit.assets" = ["*.css", "*.html", "*.js"]
