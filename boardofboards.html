<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Overview</title>
    <link rel="stylesheet" href="/shared.css" />
    <link rel="stylesheet" href="/summary.css" />
  </head>
  <body>
    <div id="toast" class="toast"></div>
    <header class="bob-topbar">
      <strong>Personal Overview</strong>
      <div class="bob-topbar-actions">
        <button id="newBoardBtn">+ New board</button>
      </div>
    </header>

    <main id="boards" class="bob-boards"></main>

    <dialog id="cardModal">
      <form method="dialog" id="cardForm">
        <h2>Edit Card</h2>
        <label>Name<input id="cardName" /></label>
        <label>Description<textarea id="cardDescription" rows="4"></textarea></label>
        <label>Owner<select id="cardOwner"></select></label>
        <label>Members</label>
        <div id="participantPicker" class="user-picker"></div>
        <menu>
          <button type="button" id="deleteCardBtn" class="danger">Delete</button>
          <button type="button" id="cancelCardBtn">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </menu>
      </form>
    </dialog>

    <dialog id="boardSettingsModal">
      <div class="bob-manage">
        <h2 id="boardSettingsTitle">Board settings</h2>
        <div id="boardSettingsFields"></div>
        <menu>
          <button type="button" id="cancelBoardSettingsBtn">Cancel</button>
          <button type="button" id="saveBoardSettingsBtn" class="primary">Save</button>
        </menu>
      </div>
    </dialog>

    <dialog id="newBoardModal">
      <form method="dialog" id="newBoardForm">
        <h2>New board</h2>
        <label>Name<input id="newBoardName" value="Kanban Board" /></label>
        <label>Copy from (optional)<select id="newBoardTemplate"></select></label>
        <menu>
          <button type="button" id="cancelNewBoardBtn">Cancel</button>
          <button type="submit" class="primary">Create</button>
        </menu>
      </form>
    </dialog>

    <dialog id="shareModal">
      <div class="bob-manage">
        <h2 id="shareModalTitle">Share board</h2>
        <p class="bob-hint">Copy a token and send it to someone so they can connect to this board.</p>
        <div class="bob-manage-actions">
          <button type="button" id="copyShareTokenBtn">Copy token</button>
        </div>
        <p class="bob-hint">Received a token from someone else? Paste it here to connect.</p>
        <div class="bob-manage-actions">
          <input id="shareConnectInput" placeholder="Paste a token" />
          <button type="button" id="shareConnectBtn">Connect</button>
        </div>
        <div class="bob-manage-actions">
          <button type="button" id="shareUnshareBtn" class="danger">Stop discussing this board</button>
        </div>
        <menu>
          <button type="button" id="closeShareBtn">Close</button>
        </menu>
      </div>
    </dialog>

    <dialog id="reactionModal">
      <form method="dialog" id="reactionForm" class="bob-manage">
        <h2>React to Differences</h2>
        <label>Reaction<select id="reactionSelect"></select></label>
        <label>Effect<div id="reactionDetails" class="change-summary"></div></label>
        <menu>
          <button type="button" id="cancelReactionBtn">Cancel</button>
          <button type="submit" class="primary">Apply</button>
        </menu>
      </form>
    </dialog>

    <dialog id="confirmModal">
      <h2 id="confirmModalTitle">Action</h2>
      <p id="confirmModalMessage" class="confirm-text"></p>
      <menu>
        <button type="button" id="confirmModalCancelBtn">Cancel</button>
        <button type="button" id="confirmModalConfirmBtn" class="danger">Confirm</button>
      </menu>
    </dialog>

    <script src="/shared.js"></script>
    <script>
      let state = null;
      let modalCard = null;
      let modalParticipants = [];
      let modalOwner = null;
      let settingsBoard = null;
      let shareBoardUuid = null;
      let reactionCard = null;
      let reactionOptions = [];
      const el = (id) => document.getElementById(id);

      async function api(path, body) {
        const response = await fetch(path, {
          method: body === undefined ? "GET" : "POST",
          headers: body === undefined ? {} : { "Content-Type": "application/json" },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        const payload = await response.json();
        if (!response.ok || payload.status === "error") {
          throw new Error(payload.reason || "Request failed");
        }
        return payload;
      }

      async function run(action, successMessage) {
        try {
          await action();
          await load();
          showToast(successMessage);
        } catch (err) {
          showToast(err.message, true);
        }
      }

      async function load() {
        state = await api("/api/boardofboards/summary");
        render();
      }


      function render() {
        const container = el("boards");
        container.replaceChildren();
        if (!state.boards.length) {
          const empty = document.createElement("p");
          empty.className = "bob-empty";
          empty.textContent = "No boards yet.";
          container.append(empty);
          return;
        }
        const expanded = expandedBoards();
        const collapsed = collapsedBoards();
        expanded.forEach((board, index) => {
          container.append(renderExpandedBoard(board, index, expanded.length));
        });
        chunk(collapsed, 5).forEach((boards, chunkIndex) => {
          const lane = document.createElement("section");
          lane.className = "bob-collapsed-lane";
          boards.forEach((board, i) =>
            lane.append(renderCollapsedBoard(board, chunkIndex * 5 + i, collapsed.length)),
          );
          container.append(lane);
        });
      }

      function renderExpandedBoard(board, index, total) {
        const panel = document.createElement("section");
        panel.className = "bob-board expanded";
        panel.append(boardHeader(board, true, index, total));
        panel.append(renderBand("Active", board, board.active_cards));
        panel.append(renderBand("Next", board, board.next_cards));
        return panel;
      }

      function renderCollapsedBoard(board, index, total) {
        const tile = document.createElement("section");
        tile.className = "bob-board collapsed";
        tile.append(boardHeader(board, false, index, total));
        return tile;
      }

      function boardHeader(board, expanded, index = 0, total = 1) {
        const header = document.createElement("div");
        header.className = "bob-board-header";
        const main = document.createElement("div");
        main.className = "bob-board-main";
        const title = document.createElement("a");
        title.className = "bob-board-title";
        title.href = `/?board=${encodeURIComponent(board.uuid)}`;
        title.textContent = board.name;
        main.append(title, objectiveElement(board));
        header.append(main);
        const tools = document.createElement("div");
        tools.className = "bob-board-tools";
        const controls = document.createElement("div");
        controls.className = "bob-board-controls";
        controls.append(moveButton("<", index === 0, () => moveBoard(board.uuid, -1)));
        controls.append(moveButton(">", index >= total - 1, () => moveBoard(board.uuid, 1)));
        if (expanded) {
          controls.append(iconButton(ICON_COLLAPSE, "Collapse", () => setExpanded(board, false)));
        } else {
          controls.append(iconButton(ICON_EXPAND, "Expand", () => setExpanded(board, true)));
        }
        controls.append(iconButton(ICON_SHARE, "Share", () => openShareModal(board)));
        controls.append(iconButton(ICON_SETTINGS, "Settings", () => openBoardSettings(board)));
        tools.append(controls, boardStatus(board));
        header.append(tools);
        return header;
      }

      function expandedBoards() {
        return (state.boards || []).filter((board) => board.expanded);
      }

      function collapsedBoards() {
        return (state.boards || []).filter((board) => !board.expanded);
      }

      function chunk(items, size) {
        const groups = [];
        for (let index = 0; index < items.length; index += size) {
          groups.push(items.slice(index, index + size));
        }
        return groups;
      }

      function moveButton(text, disabled, action) {
        const button = smallButton(text, action);
        button.classList.add("bob-move");
        button.disabled = disabled;
        return button;
      }

      function smallButton(text, action) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "bob-small-btn";
        button.textContent = text;
        button.onclick = action;
        return button;
      }

      function objectiveElement(board) {
        // A fixed-height 2-line box, bottom-aligned: short objectives sit
        // low (away from the title above), longer ones fill both lines and
        // reach up near the title. Line-clamp+ellipsis only applies while
        // not focused, so editing still shows the full text being typed.
        const wrap = document.createElement("div");
        wrap.className = "bob-objective-wrap";
        const div = document.createElement("div");
        div.className = "bob-objective";
        div.contentEditable = "true";
        div.textContent = board.objective || "";
        div.title = board.objective || "";
        div.onkeydown = (event) => {
          if (event.key === "Enter") event.preventDefault();
        };
        div.onblur = () => {
          const value = div.textContent.trim();
          div.title = value;
          run(
            () => api("/api/kanban/boards/set_objective", { board_uuid: board.uuid, objective: value }),
            "Objective updated",
          );
        };
        wrap.append(div);
        return wrap;
      }

      function boardStatus(board) {
        const status = document.createElement("div");
        status.className = "bob-board-status";
        status.append(
          statItem(board.discussion_count, "discussion"),
          statItem(board.active_cards.length, "active"),
          statItem(board.next_cards.length, "next"),
        );
        return status;
      }

      function statItem(value, label) {
        const item = document.createElement("span");
        item.className = "bob-stat";
        item.textContent = `${value} ${label}`;
        return item;
      }

      function renderBand(label, board, cards) {
        const wrap = document.createElement("div");
        wrap.className = "bob-band";
        const heading = document.createElement("h3");
        const title = document.createElement("span");
        title.textContent = label;
        const sources = document.createElement("span");
        sources.className = "bob-band-sources";
        sources.textContent = `(${bandColumnNames(board, label).join(", ") || "not set"})`;
        heading.append(title, sources);
        wrap.append(heading);
        const list = document.createElement("div");
        list.className = "bob-card-list";
        let lastRelevance = null;
        for (const card of cards) {
          if (lastRelevance === "owner" && card.relevance === "participant") {
            const divider = document.createElement("div");
            divider.className = "bob-relevance-divider";
            list.append(divider);
          }
          list.append(renderCard(board, card, label));
          lastRelevance = card.relevance;
        }
        wrap.append(list);
        return wrap;
      }

      function bandColumnNames(board, label) {
        const sourceUuids = label === "Active" ? board.active_column_uuids : board.next_column_uuids;
        const columnsByUuid = new Map(board.columns.map((column) => [column.uuid, column.name]));
        return sourceUuids.map((uuid) => columnsByUuid.get(uuid)).filter(Boolean);
      }

      function renderCard(board, card, band) {
        const row = document.createElement("div");
        row.className = "bob-card" + (card.selected ? " selected" : "");
        applyCardTransition(row, card);

        const body = document.createElement("div");
        body.className = "bob-card-body";
        const name = document.createElement("button");
        name.type = "button";
        name.className = "bob-card-name";
        name.textContent = card.name;
        name.title = "Click to edit";
        name.onclick = () => openCardModal(card);
        body.append(name);
        const description = document.createElement("p");
        description.className = "bob-card-description";
        description.textContent = card.description || "";
        body.append(description);
        row.append(body);
        row.append(cardDiscussionTools(card));
        row.append(cardPeople(card));

        const select = document.createElement("select");
        select.className = "bob-status-select";
        for (const column of board.columns) {
          const opt = document.createElement("option");
          opt.value = column.uuid;
          opt.textContent = column.name;
          select.append(opt);
        }
        if (band === "Active") {
          const opt = document.createElement("option");
          opt.value = "__selected__";
          opt.textContent = "Selected";
          select.append(opt);
        }
        select.value = card.column_uuid;
        select.onchange = () => {
          const value = select.value;
          if (value === "__selected__") {
            run(() => api("/api/boardofboards/cards/toggle_selected", { card_uuid: card.uuid }), "Updated");
            return;
          }
          run(() => api("/api/kanban/cards/move", { card_uuid: card.uuid, column_uuid: value, index: 0 }), "Moved");
        };
        row.append(select);
        return row;
      }

      function applyCardTransition(row, card) {
        const info = card.transition;
        if (!info || info.type === "in_agreement") return;
        if (info.type === "in_transition") {
          row.classList.add("in-transition");
          row.title = transitionLabel(info);
          return;
        }
        row.classList.add("diff", `event-${info.type}`);
        row.dataset.transitionSymbol = transitionSymbol(info.type);
        row.title = transitionLabel(info);
      }

      function cardDiscussionTools(card) {
        const wrap = document.createElement("div");
        wrap.className = "bob-card-discussion-tools";
        const info = card.transition;
        if (!info || ["in_agreement", "in_transition"].includes(info.type)) return wrap;
        wrap.append(reactionButton(card));
        return wrap;
      }

      function reactionButton(card) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "bob-react";
        button.textContent = "React";
        button.title = transitionLabel(card.transition);
        button.onclick = () => openReaction(card);
        return button;
      }

      function openReaction(card) {
        reactionCard = card;
        const events = (card.transition?.events || [card.transition])
          .filter((event) => event && event.type !== "in_agreement");
        reactionOptions = events.map((event, index) => {
          const changes = eventChangeSummary(event, 6) || "Adopt complete peer version";
          return {
            value: `adopt:${index}`,
            label: `${changes} (from ${transitionActorLabel(event)})`,
            details: `Adopts the complete version from ${transitionActorLabel(event)}.`,
            action: "adopt",
            event,
          };
        });
        reactionOptions.push({
          value: "keep",
          label: "Keep as is for the moment",
          details: "Keep your complete current version without asking peers to change theirs.",
          action: "perspective",
          state: "kept_mine",
        });
        const pushedChanges = localChangeSummary(card.transition, 6) || "your complete current version";
        reactionOptions.push({
          value: "push",
          label: `Push back current changes: ${pushedChanges}`,
          details: "Keep your complete current version and ask peers to adopt it.",
          action: "perspective",
          state: "pushed_back",
        });
        if (card.perspective_state && card.perspective_state !== "none") {
          reactionOptions.push({
            value: "clear",
            label: "Clear current reaction",
            details: "Remove the current keep or push-back decision.",
            action: "perspective",
            state: "none",
          });
        }
        const select = el("reactionSelect");
        select.replaceChildren();
        for (const reaction of reactionOptions) {
          const option = document.createElement("option");
          option.value = reaction.value;
          option.textContent = reaction.label;
          select.append(option);
        }
        select.value =
          card.perspective_state === "kept_mine" ? "keep" :
          card.perspective_state === "pushed_back" ? "push" :
          reactionOptions[0].value;
        updateReactionDetails();
        el("reactionModal").showModal();
      }

      function updateReactionDetails() {
        const reaction = reactionOptions.find((item) => item.value === el("reactionSelect").value);
        el("reactionDetails").textContent = reaction?.details || "";
      }

      el("reactionSelect").onchange = updateReactionDetails;
      el("cancelReactionBtn").onclick = () => el("reactionModal").close();
      el("reactionForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const reaction = reactionOptions.find((item) => item.value === el("reactionSelect").value);
        if (!reaction || !reactionCard) return;
        el("reactionModal").close();
        if (reaction.action === "adopt") {
          const missing = [reaction.event.type, reaction.event.original_type]
            .includes("peer_missing_node");
          await run(() => api("/api/kanban/adopt", {
            source_addr: reaction.event.peer_addr,
            node_uuid: reactionCard.uuid,
            adopt_absence: missing,
          }), "Adopted");
          return;
        }
        await run(() => api("/api/kanban/perspective", {
          node_uuid: reactionCard.uuid,
          state: reaction.state,
        }), "Updated");
      });

      function peerLabel(address) {
        const user = (state.users || []).find((item) => item.address === address);
        if (user?.name && user.name !== "?") return user.name;
        const text = String(address || "");
        const match = text.match(/:(\d+)(?:\/)?$/);
        return match ? match[1] : text.replace(/^https?:\/\//, "") || "peer";
      }

      function userForParticipant(participant) {
        return (state.users || []).find((user) => [
          user.id, user.profile_uuid, user.identity_key, user.address,
        ].includes(participant)) || { name: "?" };
      }

      function cardPeople(card) {
        const wrap = document.createElement("div");
        wrap.className = "bob-card-people";
        const owner = card.owner_person || null;
        if (owner) wrap.append(personAvatar(owner, true));
        for (const participant of card.participant_people || []) {
          if (owner && participant.id === owner.id) continue;
          wrap.append(personAvatar(participant, false));
        }
        if (!wrap.childElementCount) {
          const empty = document.createElement("span");
          empty.className = "bob-card-people-empty";
          empty.textContent = "-";
          empty.title = "Owner: None; Participants: None";
          wrap.append(empty);
        }
        return wrap;
      }

      function personAvatar(person, owner) {
        const avatar = document.createElement("span");
        avatar.className = owner ? "participant-avatar owner" : "participant-avatar";
        avatar.title = owner ? `${person.name || "Unknown"} (owner)` : person.name || "Unknown participant";
        if (person.picture) {
          avatar.style.backgroundImage = `url("${cssUrl(person.picture)}")`;
          avatar.textContent = "";
        } else {
          avatar.textContent = initials(person.name || "?");
        }
        return avatar;
      }

      function initials(name) {
        return String(name || "?")
          .trim()
          .split(/\s+/)
          .slice(0, 2)
          .map((part) => part[0]?.toUpperCase() || "")
          .join("") || "?";
      }

      function cssUrl(value) {
        return String(value || "").replace(/["\\]/g, "\\$&");
      }

      function personFor(id) {
        return (state.people || []).find((person) => person.id === id) || { id, name: id ? id.slice(0, 8) : "", picture: "" };
      }

      function pickerCandidates() {
        // Not board-scoped (unlike kanban.html's picker) - Overview spans
        // every board and has no per-board peer topic here, so this offers
        // every peer the session knows about instead.
        const known = state.people || [];
        const already = modalParticipants
          .filter((id) => !known.some((person) => person.id === id))
          .map((id) => personFor(id));
        return [...known, ...already];
      }

      function renderUserPicker() {
        const container = el("participantPicker");
        container.replaceChildren();
        for (const person of pickerCandidates()) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "user-choice";
          if (modalParticipants.includes(person.id)) button.classList.add("selected");
          const avatar = document.createElement("span");
          avatar.className = "participant-avatar";
          if (person.picture) {
            avatar.style.backgroundImage = `url("${cssUrl(person.picture)}")`;
          } else {
            avatar.textContent = initials(person.name);
          }
          const name = document.createElement("span");
          name.textContent = person.name;
          button.append(avatar, name);
          button.onclick = () => {
            const index = modalParticipants.indexOf(person.id);
            if (index >= 0) {
              modalParticipants.splice(index, 1);
              if (modalOwner === person.id) modalOwner = null;
            } else if (person.id) {
              modalParticipants.push(person.id);
            }
            renderUserPicker();
            renderOwnerSelect();
          };
          container.append(button);
        }
      }

      function renderOwnerSelect() {
        const select = el("cardOwner");
        select.replaceChildren();
        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = "Unassigned";
        select.append(blank);
        for (const id of modalParticipants) {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = personFor(id).name;
          select.append(option);
        }
        select.value = modalParticipants.includes(modalOwner) ? modalOwner : "";
        modalOwner = select.value || null;
      }

      function setExpanded(board, expanded) {
        return run(
          () => api("/api/boardofboards/boards/settings", { board_uuid: board.uuid, expanded }),
          expanded ? "Expanded" : "Collapsed",
        );
      }

      function moveBoard(boardUuid, direction) {
        const board = (state.boards || []).find((entry) => entry.uuid === boardUuid);
        const group = board?.expanded ? expandedBoards() : collapsedBoards();
        const order = group.map((entry) => entry.uuid);
        const index = order.indexOf(boardUuid);
        const swapWith = index + direction;
        if (swapWith < 0 || swapWith >= order.length) return;
        [order[index], order[swapWith]] = [order[swapWith], order[index]];
        run(() => api("/api/boardofboards/boards/reorder", { board_uuids: order }), "Reordered");
      }

      function openBoardSettings(board) {
        settingsBoard = board;
        el("boardSettingsTitle").textContent = board.name;
        const fields = el("boardSettingsFields");
        fields.replaceChildren();
        fields.append(
          selectField("settingsActiveColumn", "Active column", board.columns, board.active_column_uuid || ""),
          selectField("settingsNextColumn", "Next column", board.columns, board.next_column_uuid || ""),
        );
        const active = el("settingsActiveColumn");
        const next = el("settingsNextColumn");
        active.onchange = () => {
          if (active.value && active.value === next.value) next.value = "";
        };
        next.onchange = () => {
          if (next.value && next.value === active.value) active.value = "";
        };
        el("boardSettingsModal").showModal();
      }

      function selectField(id, text, columns, value) {
        const label = document.createElement("label");
        label.textContent = text;
        const select = document.createElement("select");
        select.id = id;
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "None";
        select.append(empty);
        for (const column of columns) {
          const option = document.createElement("option");
          option.value = column.uuid;
          option.textContent = column.name;
          select.append(option);
        }
        select.value = value;
        label.append(select);
        return label;
      }

      el("cancelBoardSettingsBtn").onclick = () => el("boardSettingsModal").close();
      el("saveBoardSettingsBtn").onclick = () => {
        const board = settingsBoard;
        el("boardSettingsModal").close();
        run(
          () =>
            api("/api/boardofboards/boards/settings", {
              board_uuid: board.uuid,
              active_column_uuid: el("settingsActiveColumn").value,
              next_column_uuid: el("settingsNextColumn").value,
            }),
          "Settings saved",
        );
      };

      function openCardModal(card) {
        modalCard = card;
        el("cardName").value = card.name || "";
        el("cardDescription").value = card.description || "";
        modalParticipants = Array.isArray(card.participants) ? [...card.participants] : [];
        modalOwner = card.owner || null;
        renderUserPicker();
        renderOwnerSelect();
        el("cardOwner").onchange = () => {
          modalOwner = el("cardOwner").value || null;
        };
        el("cardModal").showModal();
      }

      el("cancelCardBtn").onclick = () => el("cardModal").close();
      el("deleteCardBtn").onclick = () => {
        const card = modalCard;
        if (!card) return;
        confirmAction("Delete card?", "This removes the card from its board.", () => {
          el("cardModal").close();
          return run(() => api("/api/kanban/cards/delete", { card_uuid: card.uuid }), "Card deleted");
        });
      };
      el("cardForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const card = modalCard;
        el("cardModal").close();
        run(
          () =>
            api("/api/kanban/cards/update", {
              card_uuid: card.uuid,
              name: el("cardName").value,
              description: el("cardDescription").value,
              participants: dedupe(modalParticipants),
              owner: modalOwner || null,
            }),
          "Card updated",
        );
      });

      el("newBoardBtn").onclick = () => {
        el("newBoardName").value = "Kanban Board";
        const select = el("newBoardTemplate");
        select.replaceChildren();
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "Start empty";
        select.append(empty);
        for (const board of state.boards || []) {
          const opt = document.createElement("option");
          opt.value = board.uuid;
          opt.textContent = board.name;
          select.append(opt);
        }
        el("newBoardModal").showModal();
      };

      el("cancelNewBoardBtn").onclick = () => el("newBoardModal").close();
      el("newBoardForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const name = el("newBoardName").value || "Kanban Board";
        const templateUuid = el("newBoardTemplate").value;
        el("newBoardModal").close();
        run(async () => {
          if (templateUuid) {
            const result = await api("/api/kanban/boards/copy", { board_uuid: templateUuid });
            if (result.value) {
              await api("/api/kanban/boards/rename", { board_uuid: result.value, name });
            }
            return result;
          }
          return api("/api/kanban/boards/create", { name });
        }, "Board created");
      });

      // The token itself is plain JSON assembled server-side (only the
      // server knows which channels - e.g. relay - it actually has
      // configured); base64 here is purely a copy/paste-friendly wrapper
      // for the browser, not a wire-format requirement.
      async function fetchConnectToken(topicUuids) {
        const params = new URLSearchParams();
        for (const uuid of topicUuids) params.append("topic_uuids", uuid);
        return api(`/api/connect_token?${params.toString()}`);
      }

      function decodeConnectToken(encoded) {
        const token = JSON.parse(atob(encoded.trim()));
        if (token.version !== 1 || !Array.isArray(token.topic_uuids) || !token.topic_uuids.length) {
          throw new Error("Invalid or unrecognized token");
        }
        return token;
      }

      async function openShareModal(board) {
        shareBoardUuid = board.uuid;
        el("shareModalTitle").textContent = `Share "${board.name}"`;
        el("shareConnectInput").value = "";
        el("shareModal").showModal();
      }

      el("copyShareTokenBtn").onclick = async () => {
        const token = await fetchConnectToken([shareBoardUuid]);
        await navigator.clipboard.writeText(btoa(JSON.stringify(token)));
        showToast("Token copied");
      };

      el("shareConnectBtn").onclick = () => {
        let token;
        try {
          token = decodeConnectToken(el("shareConnectInput").value);
        } catch (err) {
          showToast("Invalid token", true);
          return;
        }
        run(() => api("/api/connect", { token }), "Connected");
      };

      el("shareUnshareBtn").onclick = () => {
        el("shareModal").close();
        confirmAction(
          "Stop discussing this board?",
          "This stops discussing it with everyone currently on it. The board itself is not deleted.",
          () => run(() => api("/api/kanban/boards/unshare", { board_uuid: shareBoardUuid }), "Stopped discussing this board"),
        );
      };

      el("closeShareBtn").onclick = () => el("shareModal").close();

      async function openShareModalFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const boardUuid = params.get("share");
        if (!boardUuid) return;
        const board = (state.boards || []).find((entry) => entry.uuid === boardUuid);
        if (board) await openShareModal(board);
        params.delete("share");
        const query = params.toString();
        window.history.replaceState({}, "", window.location.pathname + (query ? `?${query}` : ""));
      }

      load()
        .then(openShareModalFromUrl)
        .catch((err) => showToast(err.message, true));

      function isEditingBoards() {
        // Refreshing rebuilds #boards from scratch, which would yank focus
        // out from under an in-progress edit (objective text, card fields,
        // the status dropdown) - skip the poll while one of those is
        // focused rather than fighting the user's cursor.
        const active = document.activeElement;
        if (!active || !el("boards").contains(active)) return false;
        return active.isContentEditable || ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName);
      }
      setInterval(() => {
        if (isEditingBoards()) return;
        load().catch((err) => showToast(err.message, true));
      }, 1500);
    </script>
  </body>
</html>
